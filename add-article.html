<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Artikel - NewsHub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <h1>📰 NewsHub</h1>
                    <p>Sistem Manajemen Artikel Modern</p>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="form-header">
                <a href="index.html" class="btn-back">← Kembali</a>
                <h2>Tambah Artikel Baru</h2>
            </div>

            <form id="articleForm" class="article-form" action="process/add_article.php" method="POST">
                <div class="form-group">
                    <label for="title">Judul Artikel</label>
                    <input type="text" id="title" name="title" required placeholder="Masukkan judul artikel...">
                    <span class="char-count">0/100</span>
                </div>

                <div class="form-group">
                    <label for="author">Penulis</label>
                    <input type="text" id="author" name="author" required placeholder="Nama penulis...">
                </div>

                <div class="form-group">
                    <label for="lead">Lead (Ringkasan)</label>
                    <textarea id="lead" name="abstraksi" rows="4" required placeholder="Ringkasan singkat artikel..."></textarea>
                    <span class="char-count">0/300</span>
                </div>

                <div class="form-group">
                    <label for="content">Konten Artikel</label>
                    <textarea id="content" name="content" rows="10" required placeholder="Tulis konten artikel lengkap di sini..."></textarea>
                    <span class="char-count">0/5000</span>
                </div>

                <div class="form-actions">
                    <a href="index.html" class="btn btn-secondary">Batal</a>
                    <button type="submit" class="btn btn-primary">
                        <span class="icon">✓</span>
                        Simpan Artikel
                    </button>
                </div>
            </form>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p class="footer-copyright">© 2025 Tri Puji Antoro | Kelas 07TPLM006</p>
            <p>&copy; 2025 NewsHub - Sistem Manajemen Artikel Modern. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
